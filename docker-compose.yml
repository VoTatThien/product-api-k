services:
  nammongodb:
    image: mongo:7
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
    volumes:
      - mongodb_data:/data/db
    networks:
      - product-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { db.adminCommand(\"ping\"); print(\"healthy\"); } catch(e) { quit(1); }'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin123}@nammongodb:27017/productdb?authSource=admin
      NODE_ENV: production
    depends_on:
      nammongodb:
        condition: service_healthy
    networks:
      - product-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
    driver: local

networks:
  product-network:
    driver: bridge
