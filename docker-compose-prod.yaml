# ==============================================================
# docker-compose-prod.yaml
# Production Docker Compose for Product API
# Pulls the production image from Docker Hub after GitHub Actions CD
# ==============================================================

services:
  # MongoDB Database Service
  nammongodb:
    image: mongo:7
    container_name: nammongodb-prod
    restart: always
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - product-prod-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { db.adminCommand(\"ping\"); print(\"healthy\"); } catch(e) { quit(1); }'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Product RESTful API Service (from Docker Hub)
  product-api:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/product-api:latest
    container_name: product-api-prod
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin123}@nammongodb:27017/productdb?authSource=admin
      NODE_ENV: production
    depends_on:
      nammongodb:
        condition: service_healthy
    networks:
      - product-prod-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==============================================================
  # Watchtower Service: Automated CD from Docker Hub to Local Engine
  # Tự động thăm dò Docker Hub mỗi 30 giây, khi có image mới thì tự pull
  # và khởi động lại product-api-prod một cách liền mạch!
  # ==============================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: product-api-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup product-api-prod
    environment:
      DOCKER_API_VERSION: "1.40"
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    networks:
      - product-prod-net

volumes:
  mongodb_prod_data:
    driver: local

networks:
  product-prod-net:
    driver: bridge
